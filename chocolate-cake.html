<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chocolate Cake | COCO BAR</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>COCO BAR</h1>
      <p>Bake it. Cake it.</p>
    </header>

    <nav class="navbar px-3 px-lg-5">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="coco-bar.png" alt="COCO BAR Logo" />
          <span>COCO BAR</span>
        </a>

        <!-- 1. Hidden Checkbox (Toggle Logic) -->
        <input type="checkbox" id="menu-toggle" class="menu-checkbox" />

        <!-- 2. Hamburger Button (Label jo checkbox ko control kare ga) -->
        <label for="menu-toggle" class="navbar-toggler">
          <span class="navbar-toggler-icon"></span>
        </label>

        <!-- 3. Menu Links & Cart Container -->
        <div class="navbar-menu" id="mainNavbar">
          <ul class="navbar-nav mx-auto mb-2 mb-md-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html">Cakes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html">Cupcakes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#Contact">Contact</a>
            </li>
          </ul>

          <a href="#menu" class="nav-link cart">
            <i class="bi bi-cart3"></i>
          </a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row g-4 align-items-center">
        <div class="col-12 col-md-6">
          <img
            src="chocolate-cake.jfif"
            alt="Chocolate Cake"
            class="img-fluid rounded"
          />
        </div>

        <div class="col-12 col-md-6">
          <h2>Chocolate Cake</h2>
          <p class="price">Rs. 2500</p>
          <p>
            Enjoy our rich, moist chocolate cake, made for chocolate lovers and
            perfect for every celebration.
          </p>
          <label for="quantity" class="form-label">Quantity</label>
          <select id="quantity" class="form-select mb-3">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>

          <button type="button" class="btn btn-outline-dark">
            Add to Cart
          </button>
        </div>
      </div>
    </main>

    <footer id="Contact">
      <h3>COCO BAR</h3>
      <p>Bake it. Cake it.</p>
      <p>&copy; 2026 Coco Bar. All rights reserved.</p>
    </footer>
  </body>
</html>
